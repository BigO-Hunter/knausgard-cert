name: Lean proof

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spot-certificate:
    name: Core-Lean spot certificate (Defs + Table + Spot)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - name: Check out the certificate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Pin the toolchain named in PROVENANCE.md (repo ships no lean-toolchain)
        run: echo 'leanprover/lean4:v4.33.0-rc2' > lean-toolchain
      - name: Install Lean (no Lake package; core Lean only, no Mathlib)
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          lake-package-directory: .
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
      - name: Kernel-check the checker arithmetic, the table accessor, and the four spot boxes
        run: |
          lean -o cert/Defs.olean cert/Defs.lean
          lean -o cert/Table.olean cert/Table.lean
          LEAN_PATH=cert lean cert/Spot.lean
      # cert/Partial.lean is deliberately not run: MANIFEST.txt records that its
      # kernel check needs ~6 GB RSS per accepted box and did not complete on the
      # source host. The spot boxes above are the completed, reproducible part.
